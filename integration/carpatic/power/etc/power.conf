# /etc/carpatic/power.conf : sourced by carpatic-power (POSIX sh). Uncomment to change.
#LOW_PCT=15              # warn and switch to saver
#CRIT_PCT=5              # critical action
#CRIT_ACTION=hibernate   # hibernate | suspend | poweroff  (hibernate falls back to suspend if not set up)
#SAVER_PCT=20            # on battery below this: saver profile
#AC_PROFILE=performance
#BAT_PROFILE=balanced
#LOCK_ON_SLEEP=yes
#LOCK_CMD=slock
#STH_DELAY_MIN=60        # suspend-then-hibernate delay
#BATTERY_LIMIT=80        # stop charging at N percent, if the firmware allows
#SLEEP_UNLOAD_MODULES=""  # drivers that break across sleep (unloaded before, loaded after)
