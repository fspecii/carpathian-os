# Carpathian OS TLP defaults. TLP handles the hardware knobs (runtime PM, USB/Wi-Fi/SATA/PCIe power saving,
# battery thresholds); carpatic-power handles the CPU profile (governor, energy preference, platform profile).
TLP_ENABLE=1
# CPU policy is owned by carpatic-power: leave governor/EPP/boost to it
CPU_SCALING_GOVERNOR_ON_AC=""
CPU_SCALING_GOVERNOR_ON_BAT=""
CPU_ENERGY_PERF_POLICY_ON_AC=""
CPU_ENERGY_PERF_POLICY_ON_BAT=""
PLATFORM_PROFILE_ON_AC=""
PLATFORM_PROFILE_ON_BAT=""
CPU_BOOST_ON_AC=""
CPU_BOOST_ON_BAT=""
# Do not let USB autosuspend break keyboards, mice or docks
USB_AUTOSUSPEND=1
USB_EXCLUDE_BTUSB=1
USB_EXCLUDE_PHONE=1
# Wi-Fi power saving only on battery
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
# Do not touch the disks aggressively on AC; SATA link power management only on battery
SATA_LINKPWR_ON_AC="max_performance"
SATA_LINKPWR_ON_BAT="med_power_with_dipm"
# Leave battery thresholds to 'carpatic-power battery-limit' / the BIOS unless set here:
#START_CHARGE_THRESH_BAT0=75
#STOP_CHARGE_THRESH_BAT0=80
