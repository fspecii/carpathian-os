# Carpatic profile: Kylin (a style pack, see stylepacks/README.md). Original look inspired by the UKUI 4 desktop design spec
# (LinPad themes/kylin/DESIGN-SPEC.md): a 48 px light panel with a start menu, search, task view and tray, 12 px windows, daybreak blue.
# Not affiliated with Kylin / KylinSoft / openKylin. Ships a dark variant too.
LABEL="Kylin"
DESC="A clean, bright desktop with a Start menu, search and a quick-settings panel (Super+A)."
STYLEPACK=kylin
GLYPH="\u2756"
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="kylin-bottom"
BAR_TOP=0
BAR_BOTTOM=48
BAR_LEFT=0
PANEL_DESIGN=kylin
LAUNCHER=kylin            # carpatic-launch runs carpatic-startmenu --skin kylin
LAYOUT=tile               # tile | float : default layout of every workspace (master on the left). Users choose in Welcome or Settings > Desktop & Dock
KEYS=kylin.keys
SXHKD=none
SUPERTAP=yes
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

TITLEBARS=on
TITLEBAR_BUTTONS=right
TITLEBAR_STYLE=windows     # flat 30 px buttons, red close on hover; a dedicated "kylin" style (rounded-6 hover tile) is requested in NEEDS.md

FONT_UI="Noto Sans"
FONT_UI_SIZE=10
FONT_MONO="JetBrains Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light="ukui-icon-theme-default"
ICON_PREFERRED_dark="ukui-icon-theme-default"
GTK_PREFERRED_light="ukui-white"
GTK_PREFERRED_dark="ukui-black"
CURSOR="dark-sense"
CURSOR_SIZE=24
BUTTON_LAYOUT="menu:minimize,maximize,close"

PACKS="ukui-gtk ukui-icons"
CORNER_RADIUS=12          # UKUI kradius-window
INNER_GAP=8
OUTER_GAP=8
NOTIFY_POS="top-right"
NOTIFY_WIDTH=374          # UKUI notification card width
NOTIFY_RADIUS=8
NOTIFY_FORMAT="<small>%a</small>\n<b>%s</b>\n%b"

# GTK style family (gtktheme/)
GTK_STYLE=kylin
