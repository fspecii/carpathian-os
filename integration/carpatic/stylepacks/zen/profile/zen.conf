# Carpathian profile: Zen (a style pack, see stylepacks/README.md). Original look inspired by Zorin OS: roomy rounded windows, a 48 px
# icon taskbar with a start menu, soft Zorin-blue colours. Not affiliated with Zorin OS Technologies.
LABEL="Zen"
DESC="A friendly rounded desktop: icon taskbar, two-pane Start menu, soft blue colours."
STYLEPACK=zen             # marks a style pack (Settings > Style shows it in the gallery; carpatic-stylepack manages it)
GLYPH="\u2740"
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="zen-bottom"
BAR_TOP=0
BAR_BOTTOM=48
BAR_LEFT=0
PANEL_DESIGN=zorin
LAUNCHER=zen              # carpatic-launch runs carpatic-startmenu --skin zen
LAYOUT=tile               # tile | float : default layout of every workspace (master on the left). Users choose in Welcome or Settings > Desktop & Dock
KEYS=zen.keys
SXHKD=none
SUPERTAP=yes
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars ---
TITLEBARS=on
TITLEBAR_BUTTONS=right
TITLEBAR_STYLE=gnome       # round buttons: the closest of the built-in styles to Zorin's circular buttons

# --- look & feel defaults (the pack's themes add Inter + the Zorin icon pack when installed) ---
FONT_UI="Inter"
FONT_UI_SIZE=10
FONT_MONO="JetBrains Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light="ZorinBlue-Light"
ICON_PREFERRED_dark="ZorinBlue-Dark"
GTK_PREFERRED_light="ZorinBlue-Light"
GTK_PREFERRED_dark="ZorinBlue-Dark"
CURSOR="Adwaita"
CURSOR_SIZE=24
BUTTON_LAYOUT="menu:minimize,maximize,close"

# --- window look (dwm, no compositor) and notifications ---
PACKS="zorin-gtk zorin-icons"
CORNER_RADIUS=15          # Zorin's GTK decoration radius
INNER_GAP=8
OUTER_GAP=8
NOTIFY_POS="top-right"
NOTIFY_WIDTH=360
NOTIFY_RADIUS=15
NOTIFY_FORMAT="<b>%s</b>\n%b"

# GTK style family (gtktheme/)
GTK_STYLE=zen
