# Carpathian store catalog: AI & Agents. source = "ai" means a Carpathian recipe in store/ai/tools.toml (pkg = recipe id).
[category]
id = "ai"
name = "AI & Agents"
icon = "applications-science"
order = 3
blurb = "Coding agents, local models and GPU tools, one click each"
featured = true

[[app]]
id = "claude-code"
name = "Claude Code"
pkg = "claude-code"
source = "ai"
icon = "utilities-terminal"
newcomer = true
size_mb = 235
term = "claude"
description = "Anthropic's coding agent in your terminal. Reads your project, edits files, runs commands."
detail = "Official native installer. Sign in with your Claude account or use an API key from your own shell; Carpathian never stores keys."

[[app]]
id = "codex"
name = "OpenAI Codex CLI"
pkg = "codex"
source = "ai"
icon = "utilities-terminal"
newcomer = false
size_mb = 105
term = "codex"
description = "OpenAI's open-source coding agent for the terminal (static musl build)."

[[app]]
