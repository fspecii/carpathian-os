[[app]]
id = "compat-container"
tagline = "An Ubuntu box for software that cannot run on Alpine"
name = "Compatibility container"
pkg = "compat-container"
source = "ai"
icon = "utilities-terminal"
newcomer = false
size_mb = 400
term = "carpatic-ai compat enter"
description = "A managed glibc (Ubuntu) box for software that cannot run on Alpine: CUDA, ROCm, LM Studio and more."
note = "GPU passthrough for NVIDIA/AMD compute is designed but not yet tested on real hardware."

[[app]]
id = "lm-studio"
