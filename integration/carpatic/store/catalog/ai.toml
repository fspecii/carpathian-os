[[app]]
id = "ollama"
name = "Ollama"
pkg = "ollama"
source = "ai"
icon = "applications-science"
newcomer = true
size_mb = 43
launch = "none"
description = "Run language models on your own computer. Installs a background service on 127.0.0.1:11434."
note = "CPU build from Alpine. For GPU speed use llama.cpp with Vulkan."

[[app]]
id = "llama-cpp"
tagline = "Fast local inference engine and server with Vulkan GPU support"
name = "llama.cpp"
pkg = "llama-cpp"
source = "ai"
icon = "applications-science"
newcomer = false
size_mb = 80
launch = "none"
description = "Fast local inference engine and server (OpenAI-compatible API) with Vulkan GPU support."

[[app]]
id = "open-webui"
name = "Open WebUI"
pkg = "open-webui"
source = "ai"
icon = "web-browser"
newcomer = true
size_mb = 578
exec = "sh -c 'carpatic-ai webui start; sleep 20; xdg-open http://127.0.0.1:3000'"
description = "A ChatGPT-style web app for your local models. Runs in a managed container."
note = "Needs Ollama. First start takes about 40 seconds."

[[app]]
id = "jan"
