# Curated Ollama models. size_mb = sum of layer sizes from registry.ollama.ai (verified 2026-10-08).
# ram_gb is a rule of thumb (model size x ~1.3 plus context). "good" = sensible default for newcomers.
[[model]]
id = "smollm2:135m"
name = "SmolLM2 135M"
size_mb = 258
ram_gb = 1
kind = "tiny"
description = "Tiny test model. Proves everything works, answers are poor."

[[model]]
id = "llama3.2:1b"
name = "Llama 3.2 1B"
size_mb = 1260
ram_gb = 3
kind = "chat"
good = true
description = "Small general chat model. Runs on almost any laptop."

[[model]]
id = "llama3.2:3b"
name = "Llama 3.2 3B"
size_mb = 1926
ram_gb = 4
kind = "chat"
good = true
description = "Better answers, still fast on a CPU."

