  { mod="SUPER SHIFT", key="p",      desc="Command launcher (dmenu)", func="spawn", exec=["dmenu_run", "-fn", "Inter:size=10.5", "-nb", "#11151c", "-nf", "#e7ecf3", "-sb", "#1d3232", "-sf", "#e7ecf3"] },
  { mod="SUPER",       key="s",      desc="App store", func="spawn", exec=["carpatic-store-gui"] },
  { mod="SUPER SHIFT", key="Return", desc="Terminal",         func="spawn", exec=["$terminal"] },

  # ── Launchers ────────────────────────────────────────────────────────────────
  { mod="SUPER",            key="x",       desc="Terminal",                 func="spawn",       exec=["$terminal"] },

