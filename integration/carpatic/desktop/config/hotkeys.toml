# ╔══════════════════════════════════════════════════════════════════════╗
# ║              DWM Hotkeys Configuration  ·  hotkeys.toml             ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  LIVE RELOAD — save this file and changes apply instantly!           ║
# ║  Manual reload:  kill -USR1 $(pidof dwm)                             ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# ─────────────────────────────────────────────────────────────────────────────
#  FORMAT — one binding per line:
#    { mod="SUPER", key="x", desc="My app", func="spawn", exec=["myapp"] }
#
#  mod   Space-separated modifiers.  Use "" for no modifier.
#          SUPER  SHIFT  CTRL  ALT
#          Examples:  "SUPER"  "SUPER SHIFT"  "SUPER CTRL"  "SUPER CTRL SHIFT"
#
#  key   X11 key name.  Examples:
#          Letters/numbers : "a"–"z", "0"–"9"
#          Special         : "Return"  "space"  "Tab"  "Escape"  "Delete"
#                            "F1"–"F12"  "Print"  "Home"  "End"  "Page_Up"
#          Symbols         : "comma"  "period"  "semicolon"  "slash"  "equal"
#                            "minus"  "bracket_left"  "bracket_right"  "grave"
#
#  func  What to do:
#          spawn             → exec=[...] or cmd="..."  run a program / shell
#          killclient        → close focused window
#          zoom              → promote window to/from master
#          focusstack        → focus next/prev window          (i=1 or i=-1)
#          movestack         → reorder window in stack          (i=1 or i=-1)
#          incnmaster        → add/remove window from master    (i=1 or i=-1)
#          setmfact          → resize master area               (f=0.05 or f=-0.05)
#          incgaps           → grow/shrink all tiling gaps live (i=2 or i=-2)
#          setcfact          → resize window in stack slot      (f=0.25 / f=-0.25 / f=0.00)
#          setlayout         → switch layout                    (layout_idx=0/1/2)
#                               0=tiling  1=floating  2=monocle
#          togglefloating    → float or tile focused window
#          fullscreen        → true fullscreen (hides bar)
#          togglefakefullscreen → fullscreen look, bar still works
#          togglebar         → show/hide the status bar
#          focusmon          → focus next/prev monitor           (i=1 or i=-1)
#          tagmon            → send window to next/prev monitor  (i=1 or i=-1)
#          view              → switch to a tag  (ui=-1 = show all)
#          tag               → send window to a tag
#          toggleview / toggletag → also show/tag alongside current
#          quit              → exit DWM
# ─────────────────────────────────────────────────────────────────────────────

# ── VARIABLES ─────────────────────────────────────────────────────────────────
# Define shortcuts here, then use $name in any exec or cmd value below.

[vars]
terminal = "st"
webapp   = "webapp-launch"

# ── KEYBINDINGS ───────────────────────────────────────────────────────────────
