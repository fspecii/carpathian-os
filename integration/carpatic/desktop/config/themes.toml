# ╔══════════════════════════════════════════════════════════════════════╗
# ║               DWM Theme Configuration  ·  themes.toml               ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  LIVE RELOAD — just save this file and changes apply instantly!      ║
# ║  Manual reload: kill -USR1 $(pidof dwm)                              ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# HOW TO SWITCH THEME
# ───────────────────
# 1. Change the theme name in [active] below to any theme defined in this file.
# 2. Save the file — DWM, terminal, GTK, and Qt update instantly!
#
# Available themes:
#   DARK:  nord · dracula · gruvbox · catppuccin · tokyonight · onedark
#          solarized · rosepine · everforest · monochrome
#   LIGHT: catppuccin-latte · gruvbox-light · solarized-light · rosepine-dawn · tokyonight-day
#
# BORDER SIZE
# ───────────
#   borderpx = 0   → no borders (minimal look)
#   borderpx = 1   → thin, clean borders (default)
#   borderpx = 2   → thicker borders, easier to see
#   borderpx = 3   → bold borders


# ══════════════════════════════════════════════════════════════════════════════
# ACTIVE THEME  ←  only change this
# ══════════════════════════════════════════════════════════════════════════════

[active]
theme = "carpatic"   # ← change only this line to switch themes

[appearance]
borderpx = 2   # border size in pixels (0 = none, 1-3 = recommended)
# bar_font = "DejaVu Sans Mono:size=11"   # CARPATIC: optional fontconfig pattern for the bar and title bars (live)
default_layout = "tile"   # CARPATIC: "tile" or "float" - layout of every tag, applied live when the value changes
# CARPATIC window look (all live):
# border_width = 2          # px, same as borderpx
# border_active = "#81A1C1" # focused window border (and title bar frame); unset = theme accent
# border_inactive = "#3B4252"
# border_highlight = 0      # 0..6 extra px of border on the focused window only (ricer highlight)
# corner_radius = 0         # 0..20 px rounded corners on windows and title bars (XShape, no compositor needed)
# inner_gap = 8             # px between tiled windows   (gappx sets both)
# outer_gap = 8             # px between tiled windows and the screen/bar edge
# smart_gaps = 0            # 1 = no gaps when a tag has a single tiled window
# drag_tiled = "float"      # Super+drag / title-bar drag of a tiled window: "float" (pull out, drop back with the highlight) or "place" (live reorder)

# CARPATIC: client title bars with minimise / maximise / close buttons (live reload)
[tray]
enabled = 1        # dwm native system tray in the bar (nm-applet, blueman, ...); tint2 profiles set 0
icon_size = 0      # px, 0 = automatic
gap = 6

[bar]
power_button = 1   # power icon at the right end of the bar: opens the power menu

[titlebar]
enabled = 1            # master switch: 0 = no title bars at all
tiled = 1              # show title bars on tiled windows
floating = 1           # show title bars on floating windows
buttons = 1            # 0 = title only, no buttons
# Window-button look (anti-aliased, colours from the theme palette):
#   windows | macos | gnome | kde | minimal | ring | squircle | contrast | omarchy | kylin | nothing | none
button_style = "windows"
button_side = "auto"   # "auto" = the style's own side (macos: left, others: right), or force "left" / "right"
buttons_shown = "all"  # "all" or "close" (only the close button)
button_order = ""      # optional, e.g. "close,min,max" or "min,max,close"
title_align = "auto"   # "auto" (style default) | "left" | "center"
button_size = 0        # px of the nominal button (0 = scales with the bar height)
button_gap = -1        # px between buttons (-1 = style default)
height = 0             # pixels; 0 = automatic (font height + 10)
dblclick_maximize = 1  # double-click on the title bar toggles maximise

# ══════════════════════════════════════════════════════════════════════════════
# THEME DEFINITIONS  -  add or edit themes here. Keys: norm*/sel* colours for the bar and
# windows; term_color1/2/3 (red/green/yellow) also colour the window buttons.
# ══════════════════════════════════════════════════════════════════════════════

