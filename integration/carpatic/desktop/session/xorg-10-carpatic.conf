Section "InputClass"
    Identifier "carpatic libinput touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "off"
    Option "NaturalScrolling" "true"
    Option "DisableWhileTyping" "on"
EndSection

# QEMU/virtio and other virtual GPUs ("Virtual-N"): the EDID preferred mode is the size of the host window, which starts at 640x480
# (BIOS console). Always start at a proper size; real hardware ports (eDP-1, HDMI-A-1 ...) keep their native preferred mode.
Section "Monitor"
    Identifier "Virtual-1"
    Option "PreferredMode" "1920x1080"
EndSection

