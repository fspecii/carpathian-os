# Carpathian: unencrypted installs show this greeter; encrypted installs auto-login (the disk passphrase is the gate).
[Seat:*]
greeter-session = lightdm-gtk-greeter
user-session = carpatic
allow-guest = false
greeter-hide-users = false
# the login screen sizes itself for this monitor (carpatic-scale): see bin/carpatic-greeter-scale
greeter-setup-script = /usr/local/bin/carpatic-greeter-scale
