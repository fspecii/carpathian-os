# Carpathian login screen (design/login spec). Installed by carpatic-login-mode greeter.
[greeter]
background = /usr/share/backgrounds/carpatic/bucegi-dark.jpg
user-background = false
theme-name = adw-gtk3-dark
icon-theme-name = Papirus-Dark
font-name = Inter 11
cursor-theme-name = capitaine-cursors-dark
xft-antialias = true
xft-hintstyle = hintslight
indicators = ~host;~spacer;~clock;~spacer;~session;~a11y;~power
clock-format = %A, %d %B  %H:%M
position = 50%,center 50%,center
default-user-image = /usr/share/icons/hicolor/scalable/apps/carpatic.svg
hide-user-image = false
panel-position = top
