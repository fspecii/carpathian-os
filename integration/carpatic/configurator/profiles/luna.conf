# Carpathian profile: Luna (LinPad desktop-theme port; palettes/themes/luna)
# Era: the XP "Luna" years - blue taskbar with the start button left, rolling-hill wallpaper.
# DejaVu Sans stands in for the proprietary Tahoma; the era's blue gel chrome is a native dwm follow-up.
LABEL="Luna"
DESC="The XP era: a blue taskbar with window names and grouping at the bottom, softly rounded windows, a meadow wallpaper."
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="windows-bottom"
BAR_TOP=0
BAR_BOTTOM=44
BAR_LEFT=0
PANEL_DESIGN=classic      # bottom bar, window names on; grouping like the XP taskbar
PANEL_OPTS="size 44 grouping on"
LAUNCHER=windows
LAYOUT=float
KEYS=windows.keys
SXHKD=none
SUPERTAP=yes
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars: dwm [titlebar] enabled / button_side ---
TITLEBARS=on
TITLEBAR_BUTTONS=right
TITLEBAR_STYLE="luna"

# --- look & feel defaults for this style. Users override each in Carpathian Settings. ---
FONT_UI="DejaVu Sans"
FONT_UI_FALLBACK="DejaVu Sans"
FONT_UI_SIZE=9
FONT_MONO="DejaVu Sans Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light=""
ICON_PREFERRED_dark=""
GTK_PREFERRED_light=""
GTK_PREFERRED_dark=""
CURSOR="Adwaita"
CURSOR_SIZE=24
BUTTON_LAYOUT="menu:minimize,maximize,close"

# era GTK pack (B00merang Windows-XP, GPL-3.0) is NOT in the pack catalogue yet: see docs/LINPAD-THEME-PORT.md.
PACKS=""
ACCENT_dark="#316ac5"
ACCENT_light="#316ac5"
CORNER_RADIUS=8
INNER_GAP=6
OUTER_GAP=6
NOTIFY_POS="bottom-right"
NOTIFY_WIDTH=320
NOTIFY_RADIUS=6
NOTIFY_FORMAT="<b>%s</b>\n%b"

# GTK style family (gtktheme/): the generated GTK3 look for this style; native packs only when the user picks them
GTK_STYLE=windows

# Selecting this era profile installs its matching palette as a complete preset.
DEFAULT_THEME="luna"
