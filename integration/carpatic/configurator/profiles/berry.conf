# Carpathian profile: Berry (LinPad desktop-theme port; palettes/themes/berry)
# Era: the dark handheld years - a dark bezel, a floating row of big icons, blue focus. Inspired by the
# BlackBerry handheld era; no vendor names, logos or fonts are shipped. Keyboard-first like a handheld.
LABEL="Berry"
DESC="The handheld era: a dark floating dock of big icons, dark flat windows with a blue accent, a carbon-weave wallpaper."
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="windows-bottom"
BAR_TOP=0
BAR_BOTTOM=70
BAR_LEFT=0
PANEL_DESIGN=floating     # centred floating dock, big icons, dot indicators
PANEL_OPTS=""
LAUNCHER=tiling
LAYOUT=float
KEYS=tiling.keys
SXHKD=none
SUPERTAP=no
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars: dwm [titlebar] enabled / button_side ---
TITLEBARS=on
TITLEBAR_BUTTONS=right
TITLEBAR_STYLE=minimal    # small dot buttons; the era's dark chrome bezels are a native follow-up

# --- look & feel defaults for this style. Users override each in Carpathian Settings. ---
FONT_UI="Noto Sans"
FONT_UI_FALLBACK="DejaVu Sans"
FONT_UI_SIZE=10
FONT_MONO="JetBrains Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light=""
ICON_PREFERRED_dark="Papirus-Dark"
GTK_PREFERRED_light=""
GTK_PREFERRED_dark=""
CURSOR="Adwaita"
CURSOR_SIZE=24
BUTTON_LAYOUT="menu:minimize,maximize,close"

PACKS=""
ACCENT_dark="#1e8bff"
ACCENT_light="#1e8bff"
CORNER_RADIUS=10
INNER_GAP=8
OUTER_GAP=10
NOTIFY_POS="bottom-right"
NOTIFY_WIDTH=340
NOTIFY_RADIUS=12
NOTIFY_FORMAT="<b>%s</b>\n%b"

# GTK style family (gtktheme/): the generated GTK3 look for this style; native packs only when the user picks them
GTK_STYLE=carpatic

# Selecting this era profile installs its matching palette as a complete preset.
DEFAULT_THEME="berry"
