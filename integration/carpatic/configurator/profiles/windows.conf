# Carpathian profile: Windows
LABEL="Windows"
DESC="Bottom taskbar with Start button, tray and clock on the right. Floating windows. Alt+Tab, Alt+F4, Super+E, Super+D, Super+L."
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="windows-bottom"   # templates/tint2/<name>.tint2rc.tpl, one tint2 instance each
BAR_TOP=0                 # px reserved at top / bottom / left (used by carpatic-snap)
BAR_BOTTOM=48
BAR_LEFT=0
PANEL_DESIGN=windows11
LAUNCHER=windows          # templates/rofi/<name>.rasi.tpl
LAYOUT=tile               # tile | float : default layout of every workspace (master on the left). Users choose in Welcome or Settings > Desktop & Dock
KEYS=windows.keys         # dwm hotkeys (merged over desktop defaults)
SXHKD=none                # extra sxhkd file, or none
SUPERTAP=yes              # tapping Super alone opens the launcher
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars: dwm [titlebar] enabled / button_side ---
TITLEBARS=on             # on | off
TITLEBAR_BUTTONS=right      # left | right (minimise/maximise/close)
TITLEBAR_STYLE=windows          # window-button style: windows macos gnome kde minimal ring squircle contrast omarchy none

# --- look & feel defaults for this style (Windows 11-like: Noto Sans (Segoe UI is proprietary), flat adw-gtk3 recoloured by the palette). Users override each in Carpathian Settings. ---
FONT_UI_SIZE=10
FONT_MONO="JetBrains Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
GTK_PREFERRED_light=""
GTK_PREFERRED_dark=""
CURSOR="Adwaita"
CURSOR_SIZE=24
BUTTON_LAYOUT="menu:minimize,maximize,close"

# --- flagship look (see STYLE-CHECKLISTS.md) ---
PACKS="font-selawik fluent-icons"
FONT_UI="Selawik"
FONT_UI_FALLBACK="Noto Sans"
ICON_PREFERRED_dark="Fluent-dark"
ICON_PREFERRED_light="Fluent-light"
ACCENT_dark="#6cb4f0"
ACCENT_light="#1e6fb8"
CORNER_RADIUS=8
INNER_GAP=8
OUTER_GAP=8
NOTIFY_POS="bottom-right"
NOTIFY_WIDTH=360
NOTIFY_RADIUS=8
NOTIFY_FORMAT="<small>%a</small>\n<b>%s</b>\n%b"

# GTK style family (gtktheme/): the generated GTK3 look for this style; native packs only when the user picks them
GTK_STYLE=windows
