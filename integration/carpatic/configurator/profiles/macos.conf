# Carpatic profile: macOS
LABEL="macOS"
DESC="Top menu-style bar, bottom dock, Spotlight-style launcher on Super+Space, Super acts as Cmd (emulated, see README)."
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="macos-top macos-dock"
BAR_TOP=28
BAR_BOTTOM=78
BAR_LEFT=0
PANEL_DESIGN=macos
LAUNCHER=macos
LAYOUT=tile               # tile | float : default layout of every workspace (master on the left). Users choose in Welcome or Settings > Desktop & Dock
KEYS=macos.keys
SXHKD=macos.sxhkd
SUPERTAP=no
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars: dwm [titlebar] enabled / button_side ---
TITLEBARS=on             # on | off
TITLEBAR_BUTTONS=left      # left | right (minimise/maximise/close)
TITLEBAR_STYLE=macos          # window-button style: windows macos gnome kde minimal ring squircle contrast omarchy none

# --- look & feel defaults for this style (macOS-like: Inter (SF Pro is proprietary), WhiteSur GTK if installed (pack), capitaine cursors). Users override each in Carpatic Settings. ---
FONT_UI="Inter"
FONT_UI_SIZE=10
FONT_MONO="JetBrains Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light="Qogir"
ICON_PREFERRED_dark="Qogir-Dark"
GTK_PREFERRED_light="WhiteSur-Light"
GTK_PREFERRED_dark="WhiteSur-Dark"
CURSOR="capitaine-cursors-dark"
CURSOR_SIZE=24
BUTTON_LAYOUT="close,minimize,maximize:menu"

# --- flagship look (see STYLE-CHECKLISTS.md) ---
PACKS="whitesur-gtk qogir capitaine"
ACCENT_dark="#6cb4f0"
ACCENT_light="#1e6fb8"
CORNER_RADIUS=10
INNER_GAP=10
OUTER_GAP=12
NOTIFY_POS="top-right"
NOTIFY_WIDTH=340
NOTIFY_RADIUS=14
NOTIFY_FORMAT="<b>%s</b>\n%b"

# GTK style family (gtktheme/): the generated GTK3 look for this style; native packs only when the user picks them
GTK_STYLE=macos
