# Carpatic profile: Other Linux / power users
LABEL="Tiling (dwm / Omarchy-style)"
DESC="dwm tiling by default, built-in bar, Super+Shift+Space floats, Omarchy-like keybinds (Super+Return, Super+W, Super+Space...)."
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the dwm bar when it is not installed
BAR_TEMPLATES=""
BAR_TOP=30
BAR_BOTTOM=0
BAR_LEFT=0
PANEL_DESIGN=minimal
LAUNCHER=tiling
LAYOUT=tile
KEYS=tiling.keys
SXHKD=none
SUPERTAP=no
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars: dwm [titlebar] enabled / button_side ---
TITLEBARS=off             # on | off
TITLEBAR_BUTTONS=right      # left | right (minimise/maximise/close)
TITLEBAR_STYLE=minimal          # window-button style: windows macos gnome kde minimal ring squircle contrast omarchy none

# --- look & feel defaults for this style (Omarchy-like: monospace everywhere, flat adw-gtk3 recoloured by the palette). Users override each in Carpatic Settings. ---
FONT_UI="Inter"
FONT_UI_SIZE=10
FONT_MONO="JetBrains Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light=""
ICON_PREFERRED_dark=""
GTK_PREFERRED_light=""
GTK_PREFERRED_dark=""
CURSOR="Adwaita"
CURSOR_SIZE=24
BUTTON_LAYOUT=":close"

CORNER_RADIUS=0
INNER_GAP=8
OUTER_GAP=8
NOTIFY_POS="top-right"
NOTIFY_WIDTH=340
NOTIFY_RADIUS=0

# GTK style family (gtktheme/): the generated GTK3 look for this style; native packs only when the user picks them
GTK_STYLE=carpatic
