# Carpathian profile: Aero (LinPad desktop-theme port; palettes/themes/aero, light member of the pair)
# Era: the 7 years - glass title bars, a light glass taskbar with big icons. Noto Sans stands in for the
# proprietary Segoe UI; real glass needs a compositor and native dwm drawing (follow-up).
LABEL="Aero"
DESC="The 7 era: a glass-blue taskbar with big icons on the left, rounded windows, an aurora wallpaper. Pair with the aero-night theme for dark."
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="windows-bottom"
BAR_TOP=0
BAR_BOTTOM=48
BAR_LEFT=0
PANEL_DESIGN=windows11   # icon taskbar, no labels, grouped; left-aligned like 7 (the design's own default is centred)
PANEL_OPTS="align left"
LAUNCHER=windows
LAYOUT=float
KEYS=windows.keys
SXHKD=none
SUPERTAP=yes
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars: dwm [titlebar] enabled / button_side ---
TITLEBARS=on
TITLEBAR_BUTTONS=right
TITLEBAR_STYLE=windows    # flat right-side buttons; native Aero glass title bars are a follow-up

# --- look & feel defaults for this style. Users override each in Carpathian Settings. ---
FONT_UI="Noto Sans"
FONT_UI_FALLBACK="DejaVu Sans"
FONT_UI_SIZE=10
FONT_MONO="JetBrains Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light="Fluent-light"
ICON_PREFERRED_dark="Fluent-dark"
GTK_PREFERRED_light=""
GTK_PREFERRED_dark=""
CURSOR="Adwaita"
CURSOR_SIZE=24
BUTTON_LAYOUT="menu:minimize,maximize,close"

PACKS="fluent-icons"
ACCENT_dark="#4cc2ff"
ACCENT_light="#3399ff"
CORNER_RADIUS=8
INNER_GAP=8
OUTER_GAP=8
NOTIFY_POS="bottom-right"
NOTIFY_WIDTH=360
NOTIFY_RADIUS=8
NOTIFY_FORMAT="<small>%a</small>\n<b>%s</b>\n%b"

# GTK style family (gtktheme/): the generated GTK3 look for this style; native packs only when the user picks them
GTK_STYLE=windows

# Selecting this era profile installs its matching palette as a complete preset.
DEFAULT_THEME="aero"
