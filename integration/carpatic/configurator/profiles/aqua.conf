# Carpatic profile: Aqua (LinPad desktop-theme port; palettes/themes/aqua)
# Era: early OS X - pinstripes, gel buttons, a white Dock. DejaVu Sans stands in for the proprietary
# Lucida Grande; pinstriped title bars and gel traffic lights are a native dwm follow-up.
LABEL="Aqua"
DESC="Early OS X: a menu bar on top, a white dock at the bottom, gel-blue accents, a pinstripe wallpaper."
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="macos-top macos-dock"
BAR_TOP=28
BAR_BOTTOM=78
BAR_LEFT=0
PANEL_DESIGN=macos
PANEL_OPTS=""
LAUNCHER=macos
LAYOUT=float
KEYS=macos.keys
SXHKD=macos.sxhkd
SUPERTAP=no
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars: dwm [titlebar] enabled / button_side ---
TITLEBARS=on
TITLEBAR_BUTTONS=left
TITLEBAR_STYLE=macos      # traffic-light circles on the left; native gel buttons are a follow-up

# --- look & feel defaults for this style. Users override each in Carpatic Settings. ---
FONT_UI="DejaVu Sans"
FONT_UI_FALLBACK="DejaVu Sans"
FONT_UI_SIZE=10
FONT_MONO="DejaVu Sans Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light="Qogir"
ICON_PREFERRED_dark="Qogir-Dark"
GTK_PREFERRED_light=""
GTK_PREFERRED_dark=""
CURSOR="capitaine-cursors"
CURSOR_SIZE=24
BUTTON_LAYOUT="close,minimize,maximize:menu"

PACKS="qogir capitaine"
ACCENT_dark="#3875d7"
ACCENT_light="#3875d7"
CORNER_RADIUS=7
INNER_GAP=8
OUTER_GAP=10
NOTIFY_POS="top-right"
NOTIFY_WIDTH=340
NOTIFY_RADIUS=12
NOTIFY_FORMAT="<b>%s</b>\n%b"

# GTK style family (gtktheme/): the generated GTK3 look for this style; native packs only when the user picks them
GTK_STYLE=macos

# Selecting this era profile installs its matching palette as a complete preset.
DEFAULT_THEME="aqua"
