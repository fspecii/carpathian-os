# Carpatic profile: New to computers
LABEL="New to computers"
DESC="A taller taskbar with bigger icons and window names, larger text and a bigger pointer. Nothing hidden away."
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="windows-bottom"
BAR_TOP=0
BAR_BOTTOM=64
BAR_LEFT=0
PANEL_DESIGN=windows11
PANEL_OPTS="size 64 icon_size 36 labels on show_taskview off tags off"   # carpatic-panel set <key> <value> pairs, applied when this style is chosen
LAUNCHER=windows
LAYOUT=tile               # tile | float : default layout of every workspace (master on the left). Users choose in Welcome or Settings > Desktop & Dock
KEYS=windows.keys
SXHKD=none
SUPERTAP=yes
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars: dwm [titlebar] enabled / button_side ---
TITLEBARS=on             # on | off
TITLEBAR_BUTTONS=right      # left | right (minimise/maximise/close)
TITLEBAR_STYLE=windows          # window-button style: windows macos gnome kde minimal ring squircle contrast omarchy none

# --- look & feel defaults for this style (Larger text and cursor, same familiar layout as Windows). Users override each in Carpatic Settings. ---
FONT_UI="Inter"
FONT_UI_SIZE=11
FONT_MONO="JetBrains Mono"
FONT_MONO_SIZE=11
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light=""
ICON_PREFERRED_dark=""
GTK_PREFERRED_light=""
GTK_PREFERRED_dark=""
CURSOR="Adwaita"
CURSOR_SIZE=32
BUTTON_LAYOUT="menu:minimize,maximize,close"

CORNER_RADIUS=8
INNER_GAP=8
OUTER_GAP=8
NOTIFY_POS="bottom-right"
NOTIFY_WIDTH=380
NOTIFY_RADIUS=8
NOTIFY_FORMAT="<small>%a</small>\n<b>%s</b>\n%b"

# GTK style family (gtktheme/): the generated GTK3 look for this style; native packs only when the user picks them
GTK_STYLE=windows
