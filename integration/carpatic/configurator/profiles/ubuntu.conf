# Carpatic profile: Ubuntu (GNOME)
LABEL="Ubuntu (GNOME)"
DESC="Top bar with the clock in the centre, left dock, Super opens an Activities-style app grid, Super+arrows snap windows."
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="ubuntu-top ubuntu-dock"
BAR_TOP=28
BAR_BOTTOM=0
BAR_LEFT=62
PANEL_DESIGN=ubuntu
LAUNCHER=ubuntu
LAYOUT=tile               # tile | float : default layout of every workspace (master on the left). Users choose in Welcome or Settings > Desktop & Dock
KEYS=ubuntu.keys
SXHKD=none
SUPERTAP=yes
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars: dwm [titlebar] enabled / button_side ---
TITLEBARS=on             # on | off
TITLEBAR_BUTTONS=right      # left | right (minimise/maximise/close)
TITLEBAR_STYLE=gnome          # window-button style: windows macos gnome kde minimal ring squircle contrast omarchy none

# --- look & feel defaults for this style (Ubuntu-like: Cantarell (Ubuntu font is not in Alpine), Yaru GTK + icons if installed (pack)). Users override each in Carpatic Settings. ---
FONT_UI_SIZE=11
FONT_MONO="JetBrains Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light="Yaru"
ICON_PREFERRED_dark="Yaru-dark"
GTK_PREFERRED_light="Yaru"
GTK_PREFERRED_dark="Yaru-dark"
CURSOR="Adwaita"
CURSOR_SIZE=24
BUTTON_LAYOUT="menu:minimize,maximize,close"

# --- flagship look (see STYLE-CHECKLISTS.md) ---
PACKS="yaru-gtk yaru-icons font-ubuntu"
FONT_UI="Ubuntu"
FONT_UI_FALLBACK="Cantarell"
ACCENT_dark="#e95420"
ACCENT_light="#e95420"
CORNER_RADIUS=10
INNER_GAP=8
OUTER_GAP=8
NOTIFY_POS="top-center"
NOTIFY_WIDTH=380
NOTIFY_RADIUS=10
NOTIFY_FORMAT="<b>%s</b>\n%b"

# GTK style family (gtktheme/): the generated GTK3 look for this style; native packs only when the user picks them
GTK_STYLE=ubuntu
