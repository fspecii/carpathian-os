# Carpathian profile: Nothing (LinPad desktop-theme port; palettes/themes/nothing, dark, and nothing-light)
# Dot-matrix monochrome with one red accent: Noto Sans Mono body, Doto (dot-matrix, OFL, pack "font-doto")
# for the bar and headings, grey mono icons (pack "kora"), native dot-matrix square window buttons
# (TITLEBAR_STYLE=nothing, drawn by dwm/carpatic-wm decoration.rs). No Nothing assets or fonts are shipped.
LABEL="Nothing"
DESC="Dot matrix: monochrome with a single red accent, square outlined window buttons with dot glyphs, mono type. Nothing Light is the light member."
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="windows-bottom"
BAR_TOP=30
BAR_BOTTOM=0
BAR_LEFT=0
PANEL_DESIGN=minimal      # thin top bar, window names on, line indicator
PANEL_OPTS=""
LAUNCHER=tiling
LAYOUT=float
KEYS=tiling.keys
SXHKD=none
SUPERTAP=no
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars: dwm [titlebar] enabled / button_side ---
TITLEBARS=on
TITLEBAR_BUTTONS=right
TITLEBAR_STYLE=nothing    # native dot-matrix square buttons (decoration.rs "nothing")

# --- look & feel defaults for this style. Users override each in Carpathian Settings. ---
FONT_UI="Noto Sans Mono"
FONT_UI_FALLBACK="DejaVu Sans Mono"
FONT_UI_SIZE=10
FONT_MONO="Noto Sans Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light="kora-pgrey"
ICON_PREFERRED_dark="kora-pgrey"
GTK_PREFERRED_light=""
GTK_PREFERRED_dark=""
CURSOR="Adwaita"
CURSOR_SIZE=24
BUTTON_LAYOUT=":minimize,maximize,close"

PACKS="font-doto kora"
ACCENT_dark="#e5232c"
ACCENT_light="#d71921"
CORNER_RADIUS=0
INNER_GAP=8
OUTER_GAP=8
NOTIFY_POS="top-right"
NOTIFY_WIDTH=320
NOTIFY_RADIUS=0
NOTIFY_FORMAT="<b>%s</b>\n%b"

# GTK style family (gtktheme/): the generated GTK3 look for this style; native packs only when the user picks them
GTK_STYLE=nothing

# Selecting this era profile installs its matching palette as a complete preset.
DEFAULT_THEME="nothing"
