# Carpatic profile: Platinum (LinPad desktop-theme port; palettes/themes/platinum)
# Era: the classic Mac years - grey striped title bars, a menu bar on top, horizontal close/zoom boxes.
# DejaVu Sans Condensed stands in for the proprietary Charcoal; striped bars and split button sides are
# a native dwm follow-up (today: round left-side buttons).
LABEL="Platinum"
DESC="The classic Mac era: a menu bar on top, a dock at the bottom, square grey windows with buttons on the left, a periwinkle texture."
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="macos-top macos-dock"
BAR_TOP=28
BAR_BOTTOM=78
BAR_LEFT=0
PANEL_DESIGN=macos
PANEL_OPTS=""
LAUNCHER=macos
LAYOUT=float
KEYS=macos.keys
SXHKD=macos.sxhkd
SUPERTAP=no
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars: dwm [titlebar] enabled / button_side ---
TITLEBARS=on
TITLEBAR_BUTTONS=left
TITLEBAR_STYLE=macos      # round left-side buttons; native Platinum stripes/zoom boxes are a follow-up

# --- look & feel defaults for this style. Users override each in Carpatic Settings. ---
FONT_UI="DejaVu Sans Condensed"
FONT_UI_FALLBACK="DejaVu Sans"
FONT_UI_SIZE=9
FONT_MONO="DejaVu Sans Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light="Qogir"
ICON_PREFERRED_dark="Qogir"
GTK_PREFERRED_light=""
GTK_PREFERRED_dark=""
CURSOR="Adwaita"
CURSOR_SIZE=24
BUTTON_LAYOUT="close:minimize,maximize"

PACKS="qogir"
ACCENT_dark="#6666cc"
ACCENT_light="#6666cc"
CORNER_RADIUS=0
INNER_GAP=6
OUTER_GAP=8
NOTIFY_POS="top-right"
NOTIFY_WIDTH=320
NOTIFY_RADIUS=8
NOTIFY_FORMAT="<b>%s</b>\n%b"

# GTK style family (gtktheme/): the generated GTK3 look for this style; native packs only when the user picks them
GTK_STYLE=macos

# Selecting this era profile installs its matching palette as a complete preset.
DEFAULT_THEME="platinum"
