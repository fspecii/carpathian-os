# Carpatic profile: Classic 98 (LinPad desktop-theme port; palettes/themes/classic-98)
# Era: grey bevels, navy titles, a teal desktop, square windows. Original artwork only: DejaVu Sans
# stands in for the proprietary MS Sans Serif; the era's beveled chrome is a native dwm follow-up.
LABEL="Classic 98"
DESC="The 98 era: a grey taskbar with window names at the bottom, square outlined title-bar buttons, navy accents, a teal desktop."
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="windows-bottom"
BAR_TOP=0
BAR_BOTTOM=40
BAR_LEFT=0
PANEL_DESIGN=classic      # bottom bar, window names on, no grouping, line indicator
PANEL_OPTS="size 36 labels on grouping off indicator line"
LAUNCHER=windows
LAYOUT=float
KEYS=windows.keys
SXHKD=none
SUPERTAP=yes
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars: dwm [titlebar] enabled / button_side ---
TITLEBARS=on
TITLEBAR_BUTTONS=right
TITLEBAR_STYLE="classic98"

# --- look & feel defaults for this style. Users override each in Carpatic Settings. ---
FONT_UI="DejaVu Sans"
FONT_UI_FALLBACK="DejaVu Sans"
FONT_UI_SIZE=9
FONT_MONO="DejaVu Sans Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light=""
ICON_PREFERRED_dark=""
GTK_PREFERRED_light=""
GTK_PREFERRED_dark=""
CURSOR="Adwaita"
CURSOR_SIZE=24
BUTTON_LAYOUT="menu:minimize,maximize,close"

# era GTK pack (Chicago95, GPL-3.0+/MIT) is NOT in the pack catalogue yet: adw-gtk3 recoloured by the
# classic-98 palette is used; see docs/LINPAD-THEME-PORT.md "optional packs".
PACKS=""
ACCENT_dark="#000080"
ACCENT_light="#000080"
CORNER_RADIUS=0
INNER_GAP=4
OUTER_GAP=4
NOTIFY_POS="bottom-right"
NOTIFY_WIDTH=300
NOTIFY_RADIUS=0
NOTIFY_FORMAT="<b>%s</b>\n%b"

# GTK style family (gtktheme/): the generated GTK3 look for this style; native packs only when the user picks them
GTK_STYLE=windows

# Selecting this era profile installs its matching palette as a complete preset.
DEFAULT_THEME="classic-98"
