# Carpatic profile: Aero Night (LinPad desktop-theme port; palettes/themes/aero-night, dark member)
# Era: the Vista years - glass windows over a black glass taskbar. Same shell as the Aero profile,
# started dark (the aero theme is the light member of the pair).
LABEL="Aero Night"
DESC="The Vista era: a black glass taskbar with big icons, glass-blue accents, an aurora-night wallpaper. Pair with the aero theme for light."
BAR=panel                 # panel | tint2 | dwm. panel = carpatic-panel (PANEL_DESIGN); falls back to the tint2 templates below when it is not installed
BAR_TEMPLATES="windows-bottom"
BAR_TOP=0
BAR_BOTTOM=48
BAR_LEFT=0
PANEL_DESIGN=windows11   # icon taskbar, no labels, grouped; left-aligned like Vista/7
PANEL_OPTS="align left theme dark"
LAUNCHER=windows
LAYOUT=float
KEYS=windows.keys
SXHKD=none
SUPERTAP=yes
TERMINAL=carpatic-term
FILES=thunar
BROWSER=firefox

# --- window title bars: dwm [titlebar] enabled / button_side ---
TITLEBARS=on
TITLEBAR_BUTTONS=right
TITLEBAR_STYLE=windows    # flat right-side buttons; native Aero glass title bars are a follow-up

# --- look & feel defaults for this style. Users override each in Carpatic Settings. ---
FONT_UI="Noto Sans"
FONT_UI_FALLBACK="DejaVu Sans"
FONT_UI_SIZE=10
FONT_MONO="JetBrains Mono"
FONT_MONO_SIZE=10
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
ICON_PREFERRED_light="Fluent-light"
ICON_PREFERRED_dark="Fluent-dark"
GTK_PREFERRED_light=""
GTK_PREFERRED_dark=""
CURSOR="Adwaita"
CURSOR_SIZE=24
BUTTON_LAYOUT="menu:minimize,maximize,close"

PACKS="fluent-icons"
ACCENT_dark="#4cc2ff"
ACCENT_light="#3399ff"
CORNER_RADIUS=8
INNER_GAP=8
OUTER_GAP=8
NOTIFY_POS="bottom-right"
NOTIFY_WIDTH=360
NOTIFY_RADIUS=8
NOTIFY_FORMAT="<small>%a</small>\n<b>%s</b>\n%b"

# GTK style family (gtktheme/): the generated GTK3 look for this style; native packs only when the user picks them
GTK_STYLE=windows

# Selecting this era profile installs its matching palette as a complete preset.
DEFAULT_THEME="aero-night"
