# Aero look: Noto Sans stands in for the proprietary Segoe UI, rounded windows (radius 8),
# flat right-side title-bar buttons ("windows" dwm style; native Aero glass title bars are a follow-up).
# Fluent icons via the pinned "fluent-icons" pack (Papirus fallback when not installed).
FONT_UI="Noto Sans"
FONT_MONO="JetBrains Mono"
ICON_PREFERRED_light="Fluent-light"
ICON_PREFERRED_dark="Fluent-dark"
ICON_light="Papirus-Light"
ICON_dark="Papirus-Dark"
TITLEBAR_STYLE="windows"
CORNER_RADIUS=8
