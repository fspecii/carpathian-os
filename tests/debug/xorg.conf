Section "Device"
 Identifier "debug-virtio"
 Driver "modesetting"
 Option "SWcursor" "true"
EndSection
Section "Monitor"
 Identifier "debug-monitor"
 Option "PreferredMode" "1360x768"
EndSection
Section "Screen"
 Identifier "debug-screen"
 Device "debug-virtio"
 Monitor "debug-monitor"
 DefaultDepth 24
 SubSection "Display"
  Depth 24
  Modes "1360x768"
 EndSubSection
EndSection
