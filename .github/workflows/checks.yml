name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Logic, themes and private Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.85.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential fontconfig fonts-dejavu-core \
            xvfb xdotool x11-utils libx11-6 libxext6 \
            dbus-daemon python3 python3-pil python3-gi python3-gi-cairo gir1.2-gtk-3.0
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
      - name: Run quick checks
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          export PATH="/usr/bin:$HOME/.cargo/bin:$PATH"
          sh tests/run.sh --quick
      - name: Show test results
        if: always()
        run: |
          if [ -f artifacts/test-latest.md ]; then
            cat artifacts/test-latest.md
            for report in artifacts/test-run-*/summary.md; do
              [ ! -f "$report" ] || cat "$report"
            done
          fi
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quick-check-results
          path: |
            artifacts/test-run-*/
            artifacts/wm-test.log
            artifacts/xvfb.log
          if-no-files-found: ignore
          retention-days: 7
